[workspace]
resolver = "3"
members = ["crates/git-sfs-core", "crates/git-sfs"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Red-Eyed/git-sfs"
# Cargo mirrors the release tag without its leading `v`; release binaries
# embed and print the exact tag-shaped version through `GIT_SFS_VERSION`.
version = "2.0.0-rc.4"

[workspace.dependencies]
git-sfs-core = { path = "crates/git-sfs-core" }

camino = "1.2"
clap = { version = "4.6", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
hex = "0.4"
indicatif = "0.18"
flate2 = "1.1"
# `signal` is for Lock's PID-liveness check. `fs` is for pull's cache-volume
# free-space guard before batched rclone downloads.
nix = { version = "0.31", default-features = false, features = ["signal", "fs"] }
path-clean = "1.0"
pathdiff = { version = "0.2", features = ["camino"] }
proptest = "1.11"
serde = { version = "1.0", features = ["derive"] }
# rclone metadata and GitHub's published-release list.
serde_json = "1.0"
semver = "1.0"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"

# A client that pulls native-tls/OpenSSL cannot be linked statically against
# musl. ureq 3 already defaults to rustls, but the default is not a guarantee:
# another crate enabling `native-tls` would silently re-introduce the problem.
# Pinning rustls here keeps release artifacts portable.
ureq = { version = "3.3", default-features = false, features = ["rustls", "gzip"] }
# Repo tree walking (ports::repo) -- symlink-loop handling (default
# follow_links = false) and deterministic ordering.
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# `Result` is already `#[must_use]`, but `let _ = ` opts back out of it
# silently. Denying it means discarding an error requires an `#[allow]` naming
# the reason.
let_underscore_must_use = "deny"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
