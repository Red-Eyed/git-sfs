name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  __RCLONE_VERSION: v1.68.2

jobs:
  test:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable, 2026-07-16
        with:
          components: rustfmt, clippy

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Cache rclone
        id: cache-rclone
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.local/bin/rclone
          key: rclone-${{ env.__RCLONE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install rclone
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: bash scripts/install-rclone.sh

      - name: Add rclone to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Release publisher tests
        run: python3 test/release/test_publish_release.py

      - name: Build release binary
        run: cargo build --workspace --release

      - name: Workflow suite
        run: GIT_SFS_BIN=./target/release/git-sfs bash test/workflows/run.sh

      - name: Differential harness self-check
        run: python3 test/differential/run.py --binary a=./target/release/git-sfs --binary b=./target/release/git-sfs

      - name: Lock protocol conformance
        run: python3 test/differential/lock_contention.py --binary current=./target/release/git-sfs

  rust-musl:
    name: Rust (musl static link)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable, 2026-07-16
        with:
          targets: x86_64-unknown-linux-musl

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-musl-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build statically linked binary
        run: cargo build --release --target x86_64-unknown-linux-musl -p git-sfs

      - name: Verify static linking
        run: |
          binary=target/x86_64-unknown-linux-musl/release/git-sfs
          file "$binary"
          if ! file "$binary" | grep -Eq 'statically linked|static-pie linked'; then
            echo "::error::$binary is not statically linked"
            exit 1
          fi
