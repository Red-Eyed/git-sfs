name: Python wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Wheel on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            rust_target: x86_64-apple-darwin
          - runner: macos-15
            rust_target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.rust_target }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: '1.26.9'
          cache: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: '0.12.1'

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wheels-${{ matrix.rust_target }}-${{ hashFiles('Cargo.lock', 'scripts/build-python-wheel.sh') }}

      - name: Build wheel with both executables
        run: sh scripts/build-python-wheel.sh dist/wheels native

      - name: Install wheel using uv and test both executables
        shell: bash
        run: |
          version=$(cargo pkgid -p git-sfs)
          version=${version##*#}
          sh test/release/test_python_wheel.sh dist/wheels/*.whl "v${version##*@}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-wheels-${{ matrix.rust_target }}
          path: dist/wheels/*.whl
          if-no-files-found: error
