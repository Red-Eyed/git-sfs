name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable, 2026-07-16
        with:
          components: rustfmt, clippy

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --workspace

      - name: Test release publisher
        run: python3 test/release/test_publish_release.py

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux
            install_release_tools: true
            runner: ubuntu-latest
            rust_targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
            targets: linux/amd64 linux/arm64
          - artifact: darwin-amd64
            install_release_tools: false
            runner: macos-15-intel
            rust_targets: ""
            targets: native
          - artifact: darwin-arm64
            install_release_tools: false
            runner: macos-15
            rust_targets: ""
            targets: native

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable, 2026-07-16
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.artifact }}-${{ hashFiles('Cargo.lock') }}

      - name: Install release build tools
        if: matrix.install_release_tools
        run: sh scripts/install-rust-release-tools.sh

      - name: Build archives
        run: sh scripts/build-rust-release.sh "$GITHUB_REF_NAME" dist ${{ matrix.targets }}

      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Build checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
