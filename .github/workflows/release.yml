name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable, 2026-07-16
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install release build tools
        run: sh scripts/install-rust-release-tools.sh

      - name: Test
        run: cargo test --workspace

      - name: Test release publisher
        run: python3 test/release/test_publish_release.py

      - name: Build archives
        run: sh scripts/build-rust-release.sh "$GITHUB_REF_NAME" dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
