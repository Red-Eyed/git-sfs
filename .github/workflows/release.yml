name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: "1.x"
          cache: true

      - name: Install rclone
        run: sudo apt-get install -y rclone

      - name: Test
        run: go test ./...

      - name: Build archives
        run: sh scripts/build-release.sh "$GITHUB_REF_NAME" dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS scripts/install.sh --title "$GITHUB_REF_NAME" --generate-notes
          anchor="$(echo "$GITHUB_REF_NAME" | tr -d '.')"
          link="[Changelog](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md#${anchor})"
          body="${link}"$'\n\n'"$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          gh release edit "$GITHUB_REF_NAME" --notes "$body"
